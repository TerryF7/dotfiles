# Contextual modules on two lines, with time on the right.
format = '$os$all'
right_format = '$time'

# Directory and identity

[os]
disabled = false

[directory]
read_only = ' 󰌾'
truncation_symbol = '…/'

[username]
format = '[$user]($style) '

[hostname]
ssh_symbol = ' '
format = '[$ssh_symbol$hostname]($style) '

# Git branch and change counts

[git_branch]
symbol = ' '
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
modified = '!${count}'
staged = '+${count}'
untracked = '?${count}'
deleted = '✘${count}'
renamed = '»${count}'
conflicted = '=${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

# Command status, background jobs, and elapsed time

[status]
symbol = ' '
disabled = false

[jobs]
number_threshold = 1

[cmd_duration]
format = '[$duration]($style) '

# Local time at prompt generation

[time]
disabled = false
time_format = '%T'
format = '[$time]($style) '

# Runtime versions and environments without connecting words

[python]
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
format = '[$symbol($version )]($style)'

[rust]
symbol = '󱘗 '
format = '[$symbol($version )]($style)'

[java]
symbol = ' '
format = '[$symbol($version )]($style)'

[package]
symbol = '󰏗 '
format = '[$symbol$version]($style) '

