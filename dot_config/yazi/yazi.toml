[preview]
max_width = 1000
max_height = 1000

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*"
run = "mactag"
group = "mactag"

[[plugin.prepend_fetchers]]
url = "*/"
run = "mactag"
group = "mactag"

[[plugin.prepend_previewers]]
url = "*/"
run = "eza-preview"
